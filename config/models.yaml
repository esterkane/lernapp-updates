# Model tiering and provider routing (ADR-0003, ADR-0011).
# LiteLLM model strings. Change here + run /run-evals; never hard-code in business code.
tiers:
  conversation:
    model: openai/gpt-5.6-luna          # verified 2026-09-08 against the OpenAI model list (scripts/verify_models.py)
    temperature: 0.7
    max_tokens: 600
  assessment:
    model: openai/gpt-5.6-terra         # verified 2026-09-08 (OpenAI model list)
    temperature: 0.0
    max_tokens: 2000
  validator:                             # MUST differ in vendor from `assessment`
    model: anthropic/claude-sonnet-5    # TODO(verify)
    temperature: 0.0
    max_tokens: 6000
    repair_max_tokens: 12000  # bounded recovery when the provider reports truncated JSON
    # When the configured vendor has no API key, the first fallback whose vendor HAS a key (and differs
    # from the assessment vendor) is used — ADR-0003 lists both as acceptable validators.
    fallbacks:                           # order = preference; with a free-tier Gemini key, free_tier models (pricing.yaml) come first
      - gemini/gemini-3.1-pro-preview     # verified 2026-09-08 (Gemini model list); returned 429 on a free-tier key
      - gemini/gemini-3.7-flash           # free_tier eligible per pricing.yaml
      - gemini/gemini-3.1-flash-lite      # free_tier eligible; cheapest
      - anthropic/claude-sonnet-5
  generator:
    model: openai/gpt-5.6-terra
    temperature: 0.8
    max_tokens: 3000
  embedding:
    model: openai/text-embedding-3-small  # verified 2026-09-08 (OpenAI model list)
    dimensions: 1536

# EU_STRICT_MODE=true refuses to start while this is null (owner decision 2026-09-08): set the date only
# after `scripts/verify_models.py` reports OK for every eu:* id against the provider APIs.
eu_strict_verified_on: null
eu_strict_overrides:                     # applied when EU_STRICT_MODE=true
  conversation: mistral/mistral-small-4
  assessment: mistral/mistral-large-3
  validator: azure/gpt-5.6-terra-eu     # TODO(verify) Azure OpenAI EU deployment name
  generator: mistral/mistral-large-3
  embedding: mistral/mistral-embed

speech:
  stt_backend: faster_whisper            # faster_whisper | voxtral | openai
  stt_model: small                       # explicit download in UI; CPU / INT8 by default
  tts_backend: none                      # choose/test local or online voice explicitly in UI
  tts_voice: de-DE-Wavenet-B             # TODO(verify) voice name
  pron_backend: prosody_mvp              # prosody_mvp | mfa_gop | azure_batch

prompt_pins: {}                          # e.g. writing_feedback: "1.0.0" to freeze a version

providers:                               # DSGVO bookkeeping (ADR-0011)
  openai:    {dpa_url: "TODO(verify)", eu_residency: "TODO(verify) EU data residency option"}
  anthropic: {dpa_url: "TODO(verify)", eu_residency: "TODO(verify)"}
  google:    {dpa_url: "TODO(verify)", eu_residency: "TODO(verify)"}
  mistral:   {dpa_url: "TODO(verify)", eu_residency: "EU provider"}
  azure:     {dpa_url: "TODO(verify)", eu_residency: "EU regions available"}
