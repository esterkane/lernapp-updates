[project]
name = "lernapp"
version = "0.2.24"
description = "German learning app for TestDaF, work and negotiations, with local materials, practice tests and saved progress"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "pgserver>=0.1.4",
  "litellm>=1.60",
  "faster-whisper>=1.1",
  "google-cloud-texttospeech>=2.16",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "httpx>=0.27",
  "pyyaml>=6",
  "streamlit>=1.40",
  "python-multipart>=0.0.9",
  "platformdirs>=4",
  "cryptography>=42",
  "pandas>=2.2",
  "numpy>=1.26",
  "openai>=1.40",
  "packaging>=24",
  "lernapp-mcp",
  "fonttools>=4",
  "pywebview>=6,<7; sys_platform == 'win32'",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
local-tts = ["piper-tts>=1.2"]
es = ["elasticsearch>=8.14"]
phones = ["montreal-forced-aligner>=3.0", "torch>=2.3", "transformers>=4.44"]
notebooks = ["jupyter>=1.0", "nbconvert>=7.16", "matplotlib>=3.9"]

[project.scripts]
lernapp = "lernapp_launcher.cli:main"
lernapp-api = "app.main:run"

[project.gui-scripts]
lernapp-desktop = "lernapp_launcher.desktop:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "hypothesis>=6.100",
  "types-PyYAML",
  "pandas-stubs",
  "pip-licenses>=5",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["mcp"]

[tool.uv.sources]
lernapp-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "frontend/lernapp_ui", "launcher/lernapp_launcher"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", ".venv", ".claude", "lernapp-kit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "SIM105", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["backend/app"]
exclude = ["backend/app/db/migrations/"]
